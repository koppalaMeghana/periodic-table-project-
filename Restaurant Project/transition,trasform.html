<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button</title>
    <style>
        div{
            width: 20px;
            height: 10px ;

        }

</head>

    <button>Click me</button>
