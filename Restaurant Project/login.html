<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Layouts</title>
  <style>
   body{
    background-image: radial-gradient( pink,rgb(241, 125, 173),green);
    font-family: cursive;
    font-weight: bold;
    margin:0;
    display: flex;
    justify-content: center;
    align-items: center;
   }
   .outer{
    
    width: 400px;
    border-radius: 10px;
    box-shadow: 2px 2px 3px grey;
    text-align: center;
    padding: 30px;
    margin-top: 80px;
    font-family: 'Times New Roman', Times, serif;
    background-image: radial-gradient(circle,yellow,pink,rgb(54, 176, 216));
   }
   .form-group input{
    border: 2px solid;
    width: 100%;
    padding: 15px;
    box-sizing: border-box;
    border-radius: 12px;
    margin: 9px;
    }
   .img{
    border-radius: 125px;
    box-shadow: 2px 2px 5px black;
    width: 100px;
    height: 100px;
   }
   .bttn{
    margin-top: 20px;
    border: 2px solid;
    border-radius: 5px ;
    width: 25%;
    box-sizing: border-box;
    }
   
  </style>
</head>
<body>
  
    <div class="outer">
    <img class="img" src="vstand4u logo.png">
    <h2><b><span style="color: dodgerblue;">S</span></b>tudent <span style="color: dodgerblue;">L</span>ogin</h2>
    <form class="form-container">
    <div class="form-group">
      <label>Email</label>
    <input type="email" required plac/reholder=" Enter Email" id="em">
    </div>
    <div class="form-group">  <!-- -->  
      <label>Password</label>
    <input type="password" required placeholder=" Enter the password" id="ps">

    </div>
    <div class="form-group">
    <a href="xyz">Forgot Password?</a>
    </div>
    <div class="form-group">
    <button class="bttn" >Login</button>
    </div>
    </form>
    </div>
</body>
</html>
