<!doctype html>
<html>
  <head>
    <title>Cakes & Pastries Menu</title>

    <style>
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background-image: url("vegbg.jpg");
      }

      /* Header */

      h2 {
        text-align: center;
        padding: 20px;
        background: #ff5e62;
        color: white;
        margin: 0;
      }

      .cart-link {
        text-align: center;
        display: block;
        padding: 10px;
        font-size: 18px;
        font-weight: bold;
        text-decoration: none;
        color: black;
      }

      /* Container */

      .container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 25px;
        padding: 30px;
      }

      /* Card */

      .card {
        background: white;
        width: 220px;
        padding: 15px;
        border-radius: 15px;
        text-align: center;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        transition: 0.3s;
      }

      .card:hover {
        transform: translateY(-5px);
      }

      .card img {
        width: 100%;
        height: 140px;
        border-radius: 10px;
      }

      .price {
        font-weight: bold;
        margin: 5px 0;
      }

      /* Quantity */

      .qty {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        margin: 8px 0;
      }

      .qty button {
        padding: 4px 10px;
        font-size: 16px;
        cursor: pointer;
      }

      .count {
        font-weight: bold;
      }

      /* Add button */

      .addbtn {
        background: green;
        color: white;
        padding: 6px 12px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      .addbtn:hover {
        background: darkgreen;
      }
    </style>
  </head>

  <body>
    <h2>🎂 Cakes & Pastries</h2>

    <a class="cart-link" href="cart.html">🛒 View Cart</a>

    <div class="container"></div>

    <script>
      const items = [
        { name: "Chocolate Cake", price: 250, img: "Chocolate cakee.jpg" },
        { name: "Black Forest", price: 450, img: "Black Forest.jpg" },
        { name: "Red Velvet", price: 500, img: "Red Velvet.jpg" },
        { name: "Vanilla Sponge", price: 300, img: "Vanilla Sponge.webp" },
        { name: "Pineapple Cake", price: 370, img: "Pineapple.webp" },
        { name: "Carrot Cake", price: 400, img: "Carrot.webp" },
        { name: "Cheese Cake", price: 550, img: "Cheesecake.png" },
        { name: "Fruit Cake", price: 420, img: "Fruit Cake.avif" },
        { name: "Coffee Cake", price: 350, img: "Coffee Cake.jpg" },
        { name: "Butterscotch Cake", price: 390, img: "Butterscotch cake.jpg" },
      ];

      let container = document.querySelector(".container");

      items.forEach((item) => {
        container.innerHTML += `
<div class="card">

<img src="${item.img}">

<h4>${item.name}</h4>

<div class="price">₹${item.price}</div>

<div class="qty">
<button onclick="decrease(this)">-</button>
<span class="count">0</span>
<button onclick="increase(this)">+</button>
</div>

<button class="addbtn" onclick="addToCart('${item.name}',${item.price},this)">ADD</button>

</div>
`;
      });

      function increase(btn) {
        let count = btn.parentElement.querySelector(".count");
        count.innerText = parseInt(count.innerText) + 1;
      }

      function decrease(btn) {
        let count = btn.parentElement.querySelector(".count");
        if (parseInt(count.innerText) > 1) {
          count.innerText = parseInt(count.innerText) - 1;
        }
      }

      function addToCart(name, price, btn) {
        let quantity = parseInt(
          btn.parentElement.querySelector(".count").innerText,
        );

        let cart = JSON.parse(localStorage.getItem("cart")) || [];

        let existing = cart.find((item) => item.name === name);

        if (existing) {
          existing.quantity += quantity;
        } else {
          cart.push({ name, price, quantity });
        }

        localStorage.setItem("cart", JSON.stringify(cart));

        alert("Item added to cart!");
      }
    </script>
  </body>
</html>
