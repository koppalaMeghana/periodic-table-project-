<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition rotate</title>
    <style>
        div{
            width: 100px;
            height: 100px;
            background-color: darkred;
            transition: width 2s, height 2s, background-color 2s, transform 1s ease-out;

            
        }
        div:hover{
            width: 300px;
            height: 300px;
            background-color: chocolate;
            transform: rotate(180deg);
        }
    </style>
</head>
<body>
    <div></div>
    
</body>
</html>
