<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marquee tags in HTML</title>
</head>
<body>
    <!-- scroll up-->
     <marquee width="60%" direction="up" height="100px">VStand4U Solutions</marquee>
      <!-- scroll down-->
    <marquee width="60%" direction="down" height="100px">Vstand4U Solutions</marquee>
      <!-- scroll left to right-->     
      <marquee width="60%" direction="right" height="100px">Vstand4U Solutions</marquee>
    <!-- scroll right to left-->     
      <marquee width="60%" direction="left" height="100px">Vstand4U Solutions</marquee>
      <!-- scroll speed--> 
       <marquee behavior="scroll" direction="up" scrollamount="1">Slow Scrolling</marquee>
<marquee behavior="scroll" direction="right" scrollamount="12">Little Fast Scrolling</marquee>
<marquee behavior="scroll" direction="left" scrollamount="20">Fast Scrolling</marquee>
<marquee behavior="scroll" direction="right" scrollamount="50">Very Fast Scrolling</marquee>
<marquee hspace="30">meghana</marquee>
</body>
</html>
