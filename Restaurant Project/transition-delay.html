<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transform</title>
    <style>
        div{
            width: 100px;
            height: 100px;
            background-color: antiquewhite;
            transition: width 2s,;
            transition-delay: 1s;
        }
        div:hover{
            width: 300px;
        }
    </style>
</head>
<body>
    <div></div>
    
</body>
</html>
